services:
  web:
    build: ./apps/web
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api-gateway]
  api-gateway:
    build: ./apps/api-gateway
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./storage:/app/storage"]
    depends_on: [planner-service, profiling-service, cleaning-service, visualization-service, ml-advisor-service, report-service]
  planner-service:
    build: ./services/planner-service
    env_file: .env
  profiling-service:
    build: ./services/profiling-service
    volumes: ["./storage:/app/storage"]
  cleaning-service:
    build: ./services/cleaning-service
    volumes: ["./storage:/app/storage"]
  visualization-service:
    build: ./services/visualization-service
    volumes: ["./storage:/app/storage"]
  ml-advisor-service:
    build: ./services/ml-advisor-service
  report-service:
    build: ./services/report-service
    volumes: ["./storage:/app/storage"]
